[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-note-splitter"
version = "0.2.0"
description = "Split MIDI performances into isolated notes and trim rendered WAV streams"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
midi-note-splitter = "midi_note_splitter.cli:main"
stream-note-trimmer = "stream_note_trimmer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
