[project]
name = "note-extractor"
version = "0.2.0"
description = "Split MIDI performances into isolated notes and trim rendered WAV streams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2", "scipy>=1.12,<2", "tqdm>=4.69.1"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "scipy-stubs",
    "types-colorama",
    "types-pexpect",
    "types-Pygments",
    "types-PyYAML==6.0.12.20260518",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_note_splitter", "src/stream_note_trimmer"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["midi_note_splitter", "stream_note_trimmer"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[project.scripts]
midi-note-splitter = "midi_note_splitter.cli:main"
stream-note-trimmer = "stream_note_trimmer.cli:main"
