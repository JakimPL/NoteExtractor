[project]
name = "midi-note-splitter"
version = "0.1.0"
description = "Split a polyphonic MIDI performance into isolated note segments"
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
midi-note-splitter = "midi_note_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
