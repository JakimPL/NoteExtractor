[project]
name = "note-extractor"
version = "0.2.0"
description = "Split MIDI performances into isolated notes and trim rendered WAV streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3,<2",
    "pydantic>=2.13.4,<3",
    "scipy>=1.18,<2",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pre-commit==4.6.1",
    "pylint==4.0.6",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "scipy-stubs==1.18.0.1",
    "types-tqdm==4.69.0.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_note_splitter", "src/stream_note_trimmer"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["midi_note_splitter", "stream_note_trimmer"]

[tool.mypy]
mypy_path = ["src", "."]
python_version = "3.12"
strict = true
files = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mido.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["midi_note_splitter.*", "stream_note_trimmer.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[project.scripts]
midi-note-splitter = "midi_note_splitter.cli:main"
stream-note-trimmer = "stream_note_trimmer.cli:main"
